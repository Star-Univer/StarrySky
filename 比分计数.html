<!DOCTYPE html>
<html lang="zh-CN" data-page="mono">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>甲乙计分表</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 68px 12px 32px;   /* 顶部留出返回按钮的空间 */
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #000000;
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 520px; margin: 0 auto; }

  /* ===== 左上角返回按钮 ===== */
  .back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid #111111;
    color: #000000;
    text-decoration: none;
    box-shadow: 0 2px 10px rgba(15, 23, 42, .10);
    z-index: 99;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .back-btn:hover {
    transform: translateX(-2px);
    border-color: #111111;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .16);
  }
  .back-btn:active { transform: scale(.94); }
  .back-btn svg { width: 22px; height: 22px; display: block; }

  .board {
    background: #ffffff; border-radius: 16px;
    padding: 18px 14px 12px;
    box-shadow: 0 2px 10px rgba(15,23,42,.07);
    margin-bottom: 14px;
  }
  .score-line {
    display: flex; align-items: baseline; justify-content: center;
  }
  .tname {
    font-size: 15px; font-weight: 600; color: #444444; letter-spacing: 3px;
  }
  .wins {
    font-size: 44px; font-weight: 800; line-height: 1;
    min-width: 48px; text-align: center; margin: 0 4px;
  }
  .wins.a { color: #000000; }
  .wins.b { color: #000000; }
  .vs {
    font-size: 26px; font-weight: 700; color: #111111;
    margin: 0 6px; position: relative; top: -4px;
  }
  .totals {
    text-align: center; font-size: 12px; color: #555555; margin-top: 10px;
  }
  .totals b { color: #333333; font-size: 13px; margin: 0 2px; }
  .totals .sep { margin: 0 7px; color: #111111; }

  table {
    width: 100%; border-collapse: collapse; border-spacing: 0;
    background: #ffffff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(15,23,42,.06);
    table-layout: fixed;
  }
  thead th {
    background: #ffffff; font-size: 12px; font-weight: 600;
    color: #444444; padding: 9px 4px; letter-spacing: 1px; text-align: center;
  }
  tbody td {
    padding: 5px 4px; text-align: center;
    border-top: 1px solid #ffffff; vertical-align: middle;
  }
  td.idx { font-size: 13px; color: #555555; font-weight: 600; }

  select.score {
    display: block; width: 100%; min-width: 0;
    height: 44px; font-size: 20px; font-weight: 700; text-align: center;
    border: 2px solid #111111; border-radius: 10px;
    background: #ffffff; color: #000000; outline: none; padding: 0 4px;
    font-family: inherit; margin: 0;
    -webkit-box-sizing: border-box; box-sizing: border-box;
    cursor: pointer;
    -webkit-appearance: menulist-button;
    appearance: menulist-button;
  }
  select.score:focus { border-color: #111111; background: #ffffff; }
  select.score.b:focus { border-color: #111111; }
  select.score.auto {
    background: #ffffff;
    border-color: #111111;
    color: #000000;
  }

  td.res { font-size: 13px; font-weight: 700; }
  .res.winA { color: #000000; }
  .res.winB { color: #000000; }
  .res.pending { color: #111111; font-weight: 400; }
  .res.errTxt { color: #000000; font-size: 11px; font-weight: 600; }

  .tip {
    font-size: 12px; color: #555555; text-align: center;
    margin: 12px 0 0; line-height: 1.7;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1; height: 44px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    background: #ffffff; color: #000000;
    box-shadow: 0 2px 8px rgba(15,23,42,.06); cursor: pointer;
  }

  /* ================= 黑夜：纯黑底 + 白线白字 =================
     站主要求这两页是特别的：不跟全站亮度走，白天纯白、黑夜纯黑。
     用系统偏好自动切换，保持极简。 */
  html[data-user-color-scheme="dark"] {
    html, body {
      background: #000000 !important;
      color: #ffffff !important;
    }
    .board, .card, .panel, .app > *, .stat, .team, .row {
      background: #000000 !important;
      border-color: #333333 !important;
      box-shadow: none !important;
    }
    .back-btn {
      background: #000000 !important;
      border-color: #333333 !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }
    button, .btn, .btn-new, .btn-undo, .diff-btn {
      background: #000000 !important;
      color: #ffffff !important;
      border-color: #444444 !important;
      box-shadow: none !important;
    }
    button.on, .diff-btn.on, .btn.on {
      background: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
    }
    h1, h2, h3, .tname, .title, .wins, .score {
      color: #ffffff !important;
    }
    .sub, .muted, .hint, small {
      color: #aaaaaa !important;
    }
  
  /* 白天显式样式 ===== 白天显式样式（修复被压平的边框） =====
     上一轮批量换色时把边框色也换成了近白，白天就"看不见线"了。
     这里把该有的线条和底色明确写回来；黑夜规则在后面，会正常覆盖。

     注意 --card 这个变量原来**根本没定义**，所以棋盘的 background:var(--card)
     一直是透明的（页面默认白底看不出来，切黑夜就露馅）。这里补上。 */
  html:not([data-user-color-scheme="dark"]) {
    --card: #ffffff;
    --paper: #ffffff;
    --ink: #000000;
    --faint: #cccccc;
    --muted: #666666;
  }

  html:not([data-user-color-scheme="dark"]) body {
    background: #ffffff;
    color: #000000;
  }

  /* 棋盘：白底黑线（用 .board .cell 提高权重，压过后面的黑夜 !important） */
  html:not([data-user-color-scheme="dark"]) .board {
    background: #ffffff;
    border-color: #000000;
  }

  html:not([data-user-color-scheme="dark"]) .board .cell {
    background: #ffffff;
    border-right-color: #cccccc;
    border-bottom-color: #cccccc;
    color: #000000;
  }

  /* 3×3 宫的分隔线要粗一点、黑一点 */
  html:not([data-user-color-scheme="dark"]) .board .cell.br,
  html:not([data-user-color-scheme="dark"]) .board .cell.bl,
  html:not([data-user-color-scheme="dark"]) .board .cell.bt,
  html:not([data-user-color-scheme="dark"]) .board .cell.bb {
    border-color: #000000;
  }

  html:not([data-user-color-scheme="dark"]) .board .cell.sel,
  html:not([data-user-color-scheme="dark"]) .board .cell.same {
    background: #e8e8e8;
  }

  html:not([data-user-color-scheme="dark"]) .board .cell.given,
  html:not([data-user-color-scheme="dark"]) .board .cell.fixed {
    color: #000000;
    font-weight: 700;
  }

  html:not([data-user-color-scheme="dark"]) .board .cell.user {
    color: #1a4fa0;
  }

  html:not([data-user-color-scheme="dark"]) .board .cell.err,
  html:not([data-user-color-scheme="dark"]) .board .cell.error {
    background: #fdecec;
    color: #c1442e;
    border-color: #e8b4b4;
  }

  /* 按钮：白底黑边黑字；选中态黑底白字 */
  html:not([data-user-color-scheme="dark"]) .diff-btn,
  html:not([data-user-color-scheme="dark"]) .btn,
  html:not([data-user-color-scheme="dark"]) .btn-start,
  html:not([data-user-color-scheme="dark"]) .num-btn,
  html:not([data-user-color-scheme="dark"]) .rank-open,
  html:not([data-user-color-scheme="dark"]) .scope-btn,
  html:not([data-user-color-scheme="dark"]) .rdiff-btn,
  html:not([data-user-color-scheme="dark"]) .ov-btn {
    background: #ffffff;
    color: #000000;
    border: 1px solid #000000;
  }

  html:not([data-user-color-scheme="dark"]) .diff-btn.on,
  html:not([data-user-color-scheme="dark"]) .scope-btn.on,
  html:not([data-user-color-scheme="dark"]) .rdiff-btn.on,
  html:not([data-user-color-scheme="dark"]) .btn.on {
    background: #000000;
    color: #ffffff;
    border-color: #000000;
  }

  /* 文字层级 */
  html:not([data-user-color-scheme="dark"]) h1 {
    color: #000000;
  }

  html:not([data-user-color-scheme="dark"]) .sub,
  html:not([data-user-color-scheme="dark"]) .status,
  html:not([data-user-color-scheme="dark"]) .error-display {
    color: #666666;
  }

  /* 排行榜窗口 */
  html:not([data-user-color-scheme="dark"]) .rank-panel,
  html:not([data-user-color-scheme="dark"]) .overlay-panel {
    background: #ffffff;
    color: #000000;
    border-color: #000000;
  }

  html:not([data-user-color-scheme="dark"]) .rank-row {
    border-bottom-color: #dddddd;
  }

  /* 数独棋盘：黑底白线 */
    .cell, td, .grid-cell {
      background: #000000 !important;
      border-color: #333333 !important;
      color: #ffffff !important;
    }
    .cell.given, .cell.fixed { color: #ffffff !important; font-weight: 700; }
    .cell.user { color: #ffffff !important; }
    .cell.sel, .cell.selected { background: #1a1a1a !important; }
    .cell.rel, .cell.same { background: #111111 !important; }
    .cell.err, .cell.error {
      background: #2a0a0a !important;
      color: #ff9a9a !important;
      border-color: #662222 !important;
    }
    .num-btn, .keypad button {
      background: #000000 !important;
      color: #ffffff !important;
      border-color: #333333 !important;
    }
    input, textarea, select {
      background: #000000 !important;
      color: #ffffff !important;
      border-color: #444444 !important;
    }
    hr, .divider { border-color: #333333 !important; }
  }


  /* ===== 黑夜变量（全站主题驱动） =====
     js/theme.js 会给 <html> 加 data-user-color-scheme，
     这里跟着切变量；原来的 @media 版保留，两种来源都能生效。 */
  html[data-user-color-scheme="dark"] {
    --paper: #000000;
    --ink: #ffffff;
    --muted: #aaaaaa;
    --faint: #333333;
    --rel: #111111;
    --same: #1a1a1a;
    --sel: #222222;
    --user: #ffffff;
    --err: #ff9a9a;
    --err-bg: #2a0a0a;
    --err-bd: #662222;
    --ok: #7ee2a8;
    --bg: #000000;
    --text: #ffffff;
    --border: #333333;
    --card-bg: #000000;
    background: #000000;
    color: #ffffff;
  }

  html[data-user-color-scheme="dark"] body {
    background: #000000 !important;
    color: #ffffff !important;
  }

  /* 表格与表头原来写死了白底，黑夜会露出一块白，这里补上 */
  html[data-user-color-scheme="dark"] table {
    background: #000000 !important;
    box-shadow: none !important;
  }

  html[data-user-color-scheme="dark"] thead th {
    background: #000000 !important;
    color: #cccccc !important;
    border-bottom: 1px solid #333333 !important;
  }

  html[data-user-color-scheme="dark"] tbody tr,
  html[data-user-color-scheme="dark"] tbody td {
    background: #000000 !important;
    color: #ffffff !important;
    border-color: #333333 !important;
  }

  html[data-user-color-scheme="dark"] select,
  html[data-user-color-scheme="dark"] input {
    background: #000000 !important;
    color: #ffffff !important;
    border-color: #555555 !important;
  }

  html[data-user-color-scheme="dark"] select option {
    background: #000000;
    color: #ffffff;
  }
  /* 黑白主题-属性版 */
</style>
  <!-- 全站日夜主题：必须尽早同步加载，第一帧才不会闪 -->
  <script src="js/theme.js"></script>
</head>
<body>

<!-- 左上角返回箭头：跳到 index.html -->
<a class="back-btn" href="index.html" aria-label="返回主页">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M15 5L8 12l7 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<div class="app">

  <div class="board">
    <div class="score-line">
      <span class="tname">甲</span>
      <span class="wins a" id="winsA">0</span>
      <span class="vs">:</span>
      <span class="wins b" id="winsB">0</span>
      <span class="tname">乙</span>
    </div>
    <div class="totals">
      总得分
      <span class="sep">·</span>甲 <b id="totalA">0</b>
      <span class="sep">·</span>乙 <b id="totalB">0</b>
    </div>
  </div>

  <table>
    <colgroup>
      <col style="width:56px">
      <col><col>
      <col style="width:62px">
    </colgroup>
    <thead>
      <tr><th>场次</th><th>甲</th><th>乙</th><th>结果</th></tr>
    </thead>
    <tbody id="tbody">
      <tr>
        <td class="idx">1</td>
        <td><select class="score a">
          <option value="">—</option>
          <option value="0">0</option><option value="1">1</option>
          <option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option>
          <option value="6">6</option><option value="7">7</option>
          <option value="8">8</option><option value="9">9</option>
          <option value="10">10</option><option value="11">11</option>
          <option value="12">12</option><option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
        </select></td>
        <td><select class="score b">
          <option value="">—</option>
          <option value="0">0</option><option value="1">1</option>
          <option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option>
          <option value="6">6</option><option value="7">7</option>
          <option value="8">8</option><option value="9">9</option>
          <option value="10">10</option><option value="11">11</option>
          <option value="12">12</option><option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
        </select></td>
        <td class="res"></td>
      </tr>
    </tbody>
  </table>

  <div class="tip">每场先到 <b>15</b> 分者胜，填完自动出现下一场</div>

  <div class="actions">
    <button id="resetBtn" class="btn" type="button">清空重来</button>
  </div>

</div>

<script>
(function () {
  var MAX = 15;
  var tbody = document.getElementById('tbody');
  var winsAEl = document.getElementById('winsA');
  var winsBEl = document.getElementById('winsB');
  var totalAEl = document.getElementById('totalA');
  var totalBEl = document.getElementById('totalB');

  var updating = false;

  function optionsHTML() {
    var s = '<option value="">—</option>';
    for (var i = 0; i <= MAX; i++) {
      s += '<option value="' + i + '">' + i + '</option>';
    }
    return s;
  }

  function createRow() {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="idx"></td>' +
      '<td><select class="score a">' + optionsHTML() + '</select></td>' +
      '<td><select class="score b">' + optionsHTML() + '</select></td>' +
      '<td class="res"></td>';
    return tr;
  }

  function getRow(el) {
    var n = el;
    while (n) {
      if (n.tagName === 'TR') return n;
      n = n.parentNode;
    }
    return null;
  }

  function renumber() {
    var trs = tbody.getElementsByTagName('tr');
    for (var i = 0; i < trs.length; i++) {
      var tds = trs[i].getElementsByTagName('td');
      if (tds.length > 0) tds[0].textContent = i + 1;
    }
  }

  function updateScores() {
    try {
      var tA = 0, tB = 0, wA = 0, wB = 0;
      var trs = tbody.getElementsByTagName('tr');

      for (var i = 0; i < trs.length; i++) {
        var tr = trs[i];
        var tds = tr.getElementsByTagName('td');
        var sels = tr.getElementsByTagName('select');
        if (tds.length < 4 || sels.length < 2) continue;

        if (tds[0]) tds[0].textContent = i + 1;

        var av = sels[0].value === '' ? null : parseInt(sels[0].value, 10);
        var bv = sels[1].value === '' ? null : parseInt(sels[1].value, 10);

        if (av !== null) tA += av;
        if (bv !== null) tB += bv;

        var rTxt = '';
        var rCls = 'res';

        if (av === null && bv === null) {
          /* 空行 */
        } else if (av === null || bv === null) {
          rTxt = '···';
          rCls = 'res pending';
        } else if (av === MAX && bv < MAX) {
          rTxt = '甲胜';
          rCls = 'res winA';
          wA++;
        } else if (bv === MAX && av < MAX) {
          rTxt = '乙胜';
          rCls = 'res winB';
          wB++;
        } else {
          rTxt = (av === MAX && bv === MAX) ? '无效' : '未满15';
          rCls = 'res errTxt';
        }

        tds[3].setAttribute('class', rCls);
        if (tds[3].textContent !== rTxt) tds[3].textContent = rTxt;
      }

      winsAEl.textContent = wA;
      winsBEl.textContent = wB;
      totalAEl.textContent = tA;
      totalBEl.textContent = tB;

      var last = trs[trs.length - 1];
      if (last) {
        var ls = last.getElementsByTagName('select');
        if (ls.length >= 2 && ls[0].value !== '' && ls[1].value !== '') {
          tbody.appendChild(createRow());
          renumber();
        }
      }
    } catch (e) {}
  }

  /* 用户改哪个格子，另一个自动填 15 */
  function handleChange(target) {
    if (updating) return;
    if (!target || target.tagName !== 'SELECT') return;

    var tr = getRow(target);
    if (!tr) return;
    var sels = tr.getElementsByTagName('select');
    if (sels.length < 2) return;
    var aSel = sels[0];
    var bSel = sels[1];

    updating = true;

    var val = target.value;

    if (target === aSel) {
      if (val !== '') {
        /* 用户填了甲，甲是最低分 → 乙自动 15 */
        if (bSel.value !== '15') bSel.value = '15';
        bSel.setAttribute('class', 'score b auto');
      } else {
        /* 清空甲，乙也清空（回到初始） */
        if (bSel.value === '15') bSel.value = '';
        bSel.setAttribute('class', 'score b');
      }
    } else if (target === bSel) {
      if (val !== '') {
        /* 用户填了乙，乙是最低分 → 甲自动 15 */
        if (aSel.value !== '15') aSel.value = '15';
        aSel.setAttribute('class', 'score a auto');
      } else {
        if (aSel.value === '15') aSel.value = '';
        aSel.setAttribute('class', 'score a');
      }
    }

    updating = false;
    updateScores();
  }

  function onChange(e) {
    var t = e.target || e.srcElement;
    if (t && t.tagName === 'SELECT') {
      handleChange(t);
    }
  }

  if (tbody.addEventListener) {
    tbody.addEventListener('change', onChange, false);
    tbody.addEventListener('input', onChange, false);
  } else if (tbody.attachEvent) {
    tbody.attachEvent('onchange', onChange);
  }

  /* 轮询兜底 */
  var lastSnap = '';
  function snap() {
    var sels = tbody.getElementsByTagName('select');
    var s = '';
    for (var i = 0; i < sels.length; i++) {
      s += sels[i].value + '|';
    }
    return s;
  }

  setInterval(function () {
    try {
      var s = snap();
      if (s !== lastSnap) {
        lastSnap = s;
        updateScores();
        lastSnap = snap();
      }
    } catch (e) {}
  }, 150);

  function doReset() {
    tbody.innerHTML = '';
    tbody.appendChild(createRow());
    updateScores();
    lastSnap = snap();
  }

  var resetBtn = document.getElementById('resetBtn');
  if (resetBtn.addEventListener) {
    resetBtn.addEventListener('click', doReset, false);
  }
  resetBtn.onclick = doReset;

  updateScores();
  lastSnap = snap();

})();
</script>

<!-- 日夜切换（独立页用的小按钮） -->
<button id="skyThemeBtn" aria-label="切换日夜模式" title="切换日夜模式"
  style="position:fixed;top:12px;right:12px;z-index:200;width:38px;height:38px;
         display:flex;align-items:center;justify-content:center;border-radius:50%;
         border:1px solid currentColor;background:transparent;color:inherit;
         cursor:pointer;opacity:.75;transition:opacity .2s">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
       stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="sky-ico-moon" d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/>
    <g class="sky-ico-sun">
      <circle cx="12" cy="12" r="4.4"/>
      <path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/>
    </g>
  </svg>
</button>
<script>
  (function () {
    var b = document.getElementById('skyThemeBtn');
    if (!b || !window.SkyTheme) return;
    function paint() {
      var light = window.SkyTheme.get() === 'light';
      b.querySelector('.sky-ico-moon').style.display = light ? 'none' : '';
      b.querySelector('.sky-ico-sun').style.display = light ? '' : 'none';
    }
    b.addEventListener('click', function () { window.SkyTheme.toggle(); paint(); });
    b.addEventListener('mouseenter', function () { b.style.opacity = '1'; });
    b.addEventListener('mouseleave', function () { b.style.opacity = '.75'; });
    window.addEventListener('skythemechange', paint);
    paint();
  })();
</script>
</body>
</html>
