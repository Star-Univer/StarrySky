<!DOCTYPE html>
<html lang="zh-CN" data-default-color-scheme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>站长收件箱 · 星空</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4fd8'/%3E%3Cstop offset='1' stop-color='%2300AEEC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0e16'/%3E%3Cpath d='M32 8 L37 27 L56 32 L37 37 L32 56 L27 37 L8 32 L27 27 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #edf1f7;
      --text: #0f1b2b;
      --text-muted: #6a819a;
      --brand: #00AEEC;
      --nav-bg: #0a0e16;
      --nav-text: #f0f2f6;
      --glass-bg: linear-gradient(155deg,
          rgba(255, 255, 255, .86) 0%,
          rgba(255, 255, 255, .62) 45%,
          rgba(255, 255, 255, .78) 100%);
      --glass-border: rgba(255, 255, 255, .95);
      --glass-shadow: 0 26px 60px -30px rgba(20, 45, 90, .42);
      --glass-inset: inset 0 1px 0 rgba(255, 255, 255, .95);
      --glass-head-border: rgba(15, 27, 43, .10);
      --glass-title: #0f1b2b;
      --glass-sub: rgba(60, 90, 130, .55);
      --glass-item-bg: rgba(255, 255, 255, .60);
      --glass-item-border: rgba(15, 27, 43, .10);
      --glass-item-text: #0f1b2b;
      --glass-item-desc: rgba(60, 90, 130, .68);
      --sky-bg: radial-gradient(ellipse at 50% 100%,
          #143d5c 0%, #0a1d3a 35%, #050a14 70%, #010306 100%);
    }

    html[data-user-color-scheme="dark"] {
      --bg: #111b2c;
      --text: #e8eaf0;
      --text-muted: #8b9bb4;
      --glass-bg: linear-gradient(155deg,
          rgba(255, 255, 255, .18) 0%,
          rgba(255, 255, 255, .07) 45%,
          rgba(255, 255, 255, .12) 100%);
      --glass-border: rgba(255, 255, 255, .24);
      --glass-shadow: 0 30px 70px -26px rgba(0, 0, 0, .85);
      --glass-inset: inset 0 1px 0 rgba(255, 255, 255, .42);
      --glass-head-border: rgba(255, 255, 255, .14);
      --glass-title: #ffffff;
      --glass-sub: rgba(210, 226, 255, .55);
      --glass-item-bg: rgba(255, 255, 255, .06);
      --glass-item-border: rgba(255, 255, 255, .12);
      --glass-item-text: #eef4ff;
      --glass-item-desc: rgba(200, 218, 245, .60);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-top: 56px;
      transition: background .35s ease, color .35s ease;
    }

    .sky {
      position: fixed;
      inset: -10%;
      z-index: 0;
      background: var(--sky-bg);
      pointer-events: none;
      transition: background .5s ease;
    }

    /* ===== 顶部导航 ===== */
    .sub-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--nav-text);
      text-decoration: none;
      font-size: .9rem;
      padding: 7px 14px;
      border-radius: 9px;
      opacity: .85;
      transition: background .2s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, .10);
      opacity: 1;
    }

    .nav-title {
      color: #ffffff;
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .14em;
    }

    .color-toggle-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background .25s ease, transform .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .color-toggle-btn:hover {
      background: rgba(255, 255, 255, .12);
      transform: scale(1.08);
    }

    .color-toggle-btn svg {
      display: none;
      width: 22px;
      height: 22px;
    }

    html[data-user-color-scheme="dark"] .icon-moon { display: block; }
    html[data-user-color-scheme="light"] .icon-sun { display: block; }

    /* ===== 内容区 ===== */
    .page-wrap {
      position: relative;
      z-index: 2;
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .glass-card {
      position: relative;
      padding: 28px 26px 26px;
      border-radius: 28px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      animation: cardIn .7s cubic-bezier(.2, .7, .3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 2px 6px 18px;
      border-bottom: 1px solid var(--glass-head-border);
      margin-bottom: 20px;
    }

    .glass-title {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: .22em;
      color: var(--glass-title);
    }

    html[data-user-color-scheme="dark"] .glass-title {
      text-shadow: 0 0 22px rgba(130, 180, 255, .55);
    }

    .glass-sub {
      font-size: .66rem;
      letter-spacing: .26em;
      color: var(--glass-sub);
      text-transform: uppercase;
    }

    /* ===== Tab 切换 ===== */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: var(--glass-item-bg);
      border: 1px solid var(--glass-item-border);
    }

    .tab-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--glass-item-desc);
      font-family: inherit;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .25s ease, color .25s ease;
    }

    .tab-btn:hover {
      color: var(--glass-item-text);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 174, 236, .9), rgba(63, 123, 255, .9));
      color: #ffffff;
      box-shadow: 0 10px 24px -14px rgba(0, 174, 236, 1);
    }

    .badge {
      min-width: 22px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 800;
      background: rgba(0, 174, 236, .18);
      color: inherit;
    }

    .tab-btn.active .badge {
      background: rgba(0, 0, 0, .24);
      color: #ffffff;
    }

    /* ===== 列表 ===== */
    .tab-pane { display: block; }

    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--glass-item-bg);
      border: 1px solid var(--glass-item-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16);
      transition: border-color .3s ease, box-shadow .3s ease;
    }

    .msg:hover {
      border-color: rgba(0, 174, 236, .55);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .22),
        0 16px 32px -20px rgba(0, 174, 236, .9);
    }

    .msg--pending {
      border-left: 3px solid var(--brand);
    }

    .msg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .msg-user {
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--brand);
    }

    .msg-time {
      font-size: .68rem;
      letter-spacing: .06em;
      color: var(--glass-item-desc);
      white-space: nowrap;
    }

    .msg-content {
      font-size: .94rem;
      line-height: 1.62;
      color: var(--glass-item-text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ===== 回复区 ===== */
    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .reply-input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-item-border);
      background: rgba(255, 255, 255, .06);
      color: var(--glass-item-text);
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      transition: border-color .25s ease, box-shadow .25s ease;
    }

    .reply-input::placeholder {
      color: var(--glass-item-desc);
    }

    .reply-input:focus {
      border-color: rgba(0, 174, 236, .8);
      box-shadow: 0 0 0 3px rgba(0, 174, 236, .16);
    }

    .reply-btn {
      flex: 0 0 auto;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #8fdcff, #00AEEC 55%, #3f7bff);
      color: #04121c;
      font-family: inherit;
      font-size: .86rem;
      font-weight: 800;
      letter-spacing: .06em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }

    .reply-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow: 0 14px 26px -14px rgba(0, 174, 236, 1);
    }

    .reply-btn:active {
      transform: translateY(0) scale(.97);
    }

    .reply-btn[disabled] {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .msg-reply-shown {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--glass-item-border);
      font-size: .9rem;
      line-height: 1.62;
      color: var(--glass-item-text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-reply-shown b {
      color: var(--brand);
      font-weight: 800;
    }

    .msg-empty,
    .msg-loading {
      padding: 48px 12px;
      text-align: center;
      font-size: .88rem;
      letter-spacing: .06em;
      color: var(--glass-item-desc);
      line-height: 1.8;
    }

    .msg-empty a {
      color: var(--brand);
      text-decoration: none;
    }

    .msg-empty a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .page-wrap { padding: 24px 12px 60px; }
      .glass-card { padding: 20px 16px 18px; border-radius: 22px; }
      .glass-title { font-size: 1.15rem; }
      .sub-nav { padding: 0 12px; }
      .nav-title { font-size: .88rem; letter-spacing: .10em; }
      .msg-actions { flex-direction: column; }
      .reply-btn { width: 100%; }
    }
  </style>
</head>

<body>

  <div class="sky" aria-hidden="true"></div>

  <header class="sub-nav">
    <a class="back-link" href="index.html">← 返回首页</a>
    <span class="nav-title">站长收件箱</span>
    <button class="color-toggle-btn" id="colorToggleBtn" type="button" aria-label="切换日夜模式">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z" fill="#ffffff" stroke="none" />
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.6" fill="#ffffff" stroke="none" />
        <line x1="12" y1="1.8" x2="12" y2="4.2" />
        <line x1="12" y1="19.8" x2="12" y2="22.2" />
        <line x1="1.8" y1="12" x2="4.2" y2="12" />
        <line x1="19.8" y1="12" x2="22.2" y2="12" />
      </svg>
    </button>
  </header>

  <main class="page-wrap">
    <section class="glass-card">
      <div class="glass-head">
        <h1 class="glass-title">站长收件箱</h1>
        <span class="glass-sub">Admin Inbox</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="pending" type="button">
          📥 待回复 <span class="badge" id="pendingCount">0</span>
        </button>
        <button class="tab-btn" data-tab="replied" type="button">
          ✅ 已回复 <span class="badge" id="repliedCount">0</span>
        </button>
      </div>

      <div class="tab-pane" id="pane-pending">
        <div id="pendingList" class="msg-list">
          <div class="msg-loading">加载中...</div>
        </div>
      </div>

      <div class="tab-pane" id="pane-replied" style="display: none;">
        <div id="repliedList" class="msg-list">
          <div class="msg-loading">加载中...</div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      "use strict";

      var SUPABASE_URL = 'https://icjptvrlmmnxamgnemvz.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljanB0dnJsbW1ueGFtZ25lbXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5OTY5NDAsImV4cCI6MjEwNjU3Mjk0MH0.2PiF0gJet82QnQpHd8Il_6bvTPLtBeypVOYRHG_W9YU';
      var ADMIN_EMAIL = 'piao022400@qq.com';

      var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      /* ---------- 日夜模式 ---------- */
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById('colorToggleBtn');
        var KEY = 'Fluid_Color_Scheme';

        function apply() {
          var v = 'dark';
          try { v = localStorage.getItem(KEY) || 'dark'; } catch (e) { }
          if (v !== 'dark' && v !== 'light') v = 'dark';
          root.setAttribute('data-user-color-scheme', v);
        }

        function toggle() {
          var cur = root.getAttribute('data-user-color-scheme') || 'dark';
          var next = (cur === 'dark') ? 'light' : 'dark';
          try { localStorage.setItem(KEY, next); } catch (e) { }
          apply();
        }

        apply();
        if (btn) btn.addEventListener('click', toggle);
      })();

      /* ---------- 工具 ---------- */
      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      function formatTime(t) {
        if (!t) return '';
        try {
          var d = new Date(t);
          var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
            + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        } catch (e) { return ''; }
      }

      /* ---------- 权限校验 ---------- */
      async function checkAuth() {
        var pendingListEl = document.getElementById('pendingList');
        var { data: { user } } = await supabase.auth.getUser();

        if (!user || user.email !== ADMIN_EMAIL) {
          pendingListEl.innerHTML =
            '<div class="msg-empty">⛔ 无权限访问此页面<br>' +
            '此页面仅站长可见<br><br>' +
            '<a href="index.html">← 返回首页</a>' +
            '</div>';
          return false;
        }
        return true;
      }

      /* ---------- 渲染待回复 ---------- */
      function renderPending(listEl, items) {
        if (!items || items.length === 0) {
          listEl.innerHTML = '<div class="msg-empty">🎉 暂无待回复留言，全部处理完毕！</div>';
          return;
        }

        listEl.innerHTML = items.map(function (msg) {
          return '<div class="msg msg--pending">' +
            '<div class="msg-head">' +
              '<span class="msg-user">👤 ' + escapeHtml(msg.username || '匿名用户') + '</span>' +
              '<span class="msg-time">' + formatTime(msg.created_at) + '</span>' +
            '</div>' +
            '<div class="msg-content">' + escapeHtml(msg.content) + '</div>' +
            '<div class="msg-actions">' +
              '<input type="text" class="reply-input" data-id="' + msg.id + '" placeholder="输入你的回复...">' +
              '<button class="reply-btn" data-id="' + msg.id + '" type="button">发送回复</button>' +
            '</div>' +
            '</div>';
        }).join('');
      }

      /* ---------- 渲染已回复 ---------- */
      function renderReplied(listEl, items) {
        if (!items || items.length === 0) {
          listEl.innerHTML = '<div class="msg-empty">暂无已回复留言。</div>';
          return;
        }

        listEl.innerHTML = items.map(function (msg) {
          return '<div class="msg">' +
            '<div class="msg-head">' +
              '<span class="msg-user">👤 ' + escapeHtml(msg.username || '匿名用户') + '</span>' +
              '<span class="msg-time">' + formatTime(msg.created_at) + '</span>' +
            '</div>' +
            '<div class="msg-content">' + escapeHtml(msg.content) + '</div>' +
            '<div class="msg-reply-shown"><b>你已回复：</b>' + escapeHtml(msg.reply) + '</div>' +
            '</div>';
        }).join('');
      }

      /* ---------- 加载数据 ---------- */
      async function loadData() {
        var pendingListEl = document.getElementById('pendingList');
        var repliedListEl = document.getElementById('repliedList');
        var pendingCountEl = document.getElementById('pendingCount');
        var repliedCountEl = document.getElementById('repliedCount');

        var { data, error } = await supabase.from('messages')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          pendingListEl.innerHTML =
            '<div class="msg-empty" style="color:#ff8a8a;">加载失败：' +
            escapeHtml(error.message) + '</div>';
          repliedListEl.innerHTML = '';
          return;
        }

        var all = data || [];
        var pending = all.filter(function (m) { return !m.reply; });
        var replied = all.filter(function (m) { return !!m.reply; });

        pendingCountEl.textContent = pending.length;
        repliedCountEl.textContent = replied.length;

        renderPending(pendingListEl, pending);
        renderReplied(repliedListEl, replied);
      }

      /* ---------- 发送回复 ---------- */
      async function sendReply(msgId, btnEl) {
        var inputEl = document.querySelector('.reply-input[data-id="' + msgId + '"]');
        if (!inputEl) return;

        var replyText = inputEl.value.trim();
        if (!replyText) {
          alert('请输入回复内容');
          return;
        }

        if (btnEl) {
          btnEl.disabled = true;
          btnEl.textContent = '发送中...';
        }

        var { error } = await supabase.from('messages')
          .update({ reply: replyText })
          .eq('id', msgId);

        if (error) {
          alert('回复失败：' + error.message);
          if (btnEl) {
            btnEl.disabled = false;
            btnEl.textContent = '发送回复';
          }
          return;
        }

        await loadData();
      }

      /* ---------- 事件绑定 ---------- */
      function bindEvents() {
        /* Tab 切换 */
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.tab-btn').forEach(function (b) {
              b.classList.remove('active');
            });
            this.classList.add('active');

            document.querySelectorAll('.tab-pane').forEach(function (p) {
              p.style.display = 'none';
            });
            var tab = this.getAttribute('data-tab');
            document.getElementById('pane-' + tab).style.display = 'block';
          });
        });

        /* 回复按钮事件委托 */
        var pendingListEl = document.getElementById('pendingList');
        pendingListEl.addEventListener('click', function (e) {
          var btn = e.target.closest('.reply-btn');
          if (!btn) return;
          sendReply(btn.getAttribute('data-id'), btn);
        });

        /* 输入框回车提交 */
        pendingListEl.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          var input = e.target.closest('.reply-input');
          if (!input) return;
          e.preventDefault();
          var btn = pendingListEl.querySelector('.reply-btn[data-id="' + input.getAttribute('data-id') + '"]');
          if (btn) sendReply(input.getAttribute('data-id'), btn);
        });
      }

      /* ---------- 启动 ---------- */
      (async function init() {
        if (!(await checkAuth())) return;
        bindEvents();
        await loadData();
      })();
