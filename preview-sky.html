<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>星野预览 · 叠加在深色底上</title>
  <style>
    html,
    body {
      margin: 0;
      background: #03060e;
      overflow: hidden;
    }

    .stack {
      position: fixed;
      inset: 0;
    }

    .stack img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .deep {
      opacity: .92;
    }

    .mid {
      opacity: .84;
    }

    .near {
      opacity: .96;
    }
  </style>
</head>

<body>
  <div class="stack">
    <img class="deep" src="../assets/sky-deep.svg" alt="">
    <img class="mid" src="../assets/sky-mid.svg" alt="">
    <img class="near" src="../assets/sky-near.svg" alt="">
  </div>
</body>

</html>
