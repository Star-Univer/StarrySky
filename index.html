<!DOCTYPE html>
<html lang="zh-CN" data-default-color-scheme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星空</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="//at.alicdn.com/t/c/font_1749284_5i9bdhy70f8.css" />

<style>
  :root{
    --ink:#121110;
    --bg:#f5f7fb;
    --bg-card:#ffffff;
    --border:#dde5ef;
    --text:#0f1b2b;
    --text-muted:#6a819a;
    --hero-bg:radial-gradient(ellipse at 20% 15%, #1b3a63 0%, #0c1a30 40%, #05080f 100%);
    --hero-text:#ffffff;
    --brand-color:#121110;
    --phi:1.618;

    --nav-bg:#0a0e16;
    --nav-text:#f0f2f6;
    --nav-hover:rgba(255,255,255,.10);
    --nav-active-bg:rgba(255,255,255,.16);
    --nav-border:rgba(255,255,255,.08);
  }

  /* ===== 黑夜模式：改为参考图的蓝黑夜空 ===== */
  html[data-user-color-scheme="dark"]{
    --ink:#e8eaf0;
    --bg:#070d1a;                                          /* 第二屏底色也偏深蓝 */
    --bg-card:#0d1626;
    --border:#1b2a42;
    --text:#e8eaf0;
    --text-muted:#8b9bb4;
    
    /* 核心夜空底色：底部微亮的青蓝 → 深邃蓝黑 */
    --hero-bg: radial-gradient(ellipse at 50% 100%, #143d5c 0%, #0a1d3a 35%, #050a14 70%, #010306 100%);
    --hero-text:#e8eaf0;
    --brand-color:#e8eaf0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{
    scroll-behavior:auto;
    overscroll-behavior-y:none;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background .35s ease, color .35s ease;
    padding-top:56px;
  }

  ::selection{ background:var(--ink); color:var(--bg); }

  /* ===================== 顶部导航栏 ===================== */
  .site-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:300;
    height:56px;
    display:flex;
    align-items:center;
    background:var(--nav-bg);
    border-bottom:1px solid var(--nav-border);
  }

  .nav-inner{
    width:100%;
    max-width:1080px;
    margin:0 auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .nav-logo{
    font-family:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
    font-weight:900;
    font-size:1.05rem;
    letter-spacing:.16em;
    padding-left:.16em;
    color:var(--nav-text);
    text-decoration:none;
    white-space:nowrap;
    transition:opacity .2s ease;
  }

  .nav-logo:hover{ opacity:.7; }

  .nav-links{
    display:flex;
    align-items:center;
    gap:2px;
    list-style:none;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }

  .nav-links::-webkit-scrollbar{ display:none; }

  .nav-links a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:9px;
    font-size:.9rem;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--nav-text);
    text-decoration:none;
    white-space:nowrap;
    opacity:.85;
    transition:background .2s ease, opacity .2s ease;
  }

  .nav-links a:hover{
    background:var(--nav-hover);
    opacity:1;
  }

  .nav-links a.active{
    background:var(--nav-active-bg);
    opacity:1;
    font-weight:700;
  }

  .nav-links a .iconfont{
    font-size:.95rem;
    line-height:1;
    color:#ffffff;
    opacity:.9;
    transition:opacity .2s ease, transform .2s ease;
  }

  .nav-links a:hover .iconfont{
    opacity:1;
    transform:scale(1.08);
  }

  /* ===== 日夜切换按钮 ===== */
  .color-toggle-btn{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:#ffffff;
    cursor:pointer;
    padding:0;
    transition:background .25s ease, transform .25s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  .color-toggle-btn:hover{
    background:rgba(255,255,255,.12);
    transform:scale(1.10) rotate(-8deg);
  }

  .color-toggle-btn:active{ transform:scale(.92); }

  .color-toggle-btn svg{
    display:block;
    width:23px;
    height:23px;
    overflow:visible;
  }

  .color-toggle-btn svg{ display:none; }
  html[data-user-color-scheme="dark"] .icon-moon{ display:block; }
  html[data-user-color-scheme="light"] .icon-sun{ display:block; }

  /* ===================== 第一屏：星空 ===================== */
  .hero{
    position:relative;
    min-height:calc(100vh - 56px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:clamp(40px, 9vh, 100px) 24px 120px;
    overflow:hidden;
    background:var(--hero-bg);
    color:var(--hero-text);
    transition:background .5s ease;
  }

  /* ===== 星云层：改为深蓝/青蓝/少量紫色，贴合参考图 ===== */
  .nebula{
    position:absolute;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 12% 22%, rgba(30, 80, 160, .25), transparent 42%),
      radial-gradient(circle at 80% 60%, rgba(70, 50, 150, .20), transparent 48%),
      radial-gradient(circle at 40% 90%, rgba(20, 120, 180, .18), transparent 45%),
      radial-gradient(circle at 92% 15%, rgba(40, 70, 140, .22), transparent 38%),
      radial-gradient(circle at 55% 35%, rgba(100, 80, 180, .10), transparent 40%);
    filter:blur(24px);
    animation:nebulaDrift 60s ease-in-out infinite alternate;
  }

  html[data-user-color-scheme="dark"] .nebula{
    filter:blur(28px);
    opacity:.95;
  }

  @keyframes nebulaDrift{
    0%   { transform:translate3d(0, 0, 0) scale(1); }
    100% { transform:translate3d(-2%, 1.5%, 0) scale(1.06); }
  }

  /* ===== 无限滚动的星宿全景层（完全保持不变） ===== */
  .stars-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
  }

  .stars-track{
    position:absolute;
    top:0;
    left:0;
    width:200%;
    height:100%;
    display:flex;
    animation:scrollStars 110s linear infinite;
    will-change:transform;
  }

  .stars-copy{
    flex:0 0 50%;
    height:100%;
    position:relative;
  }

  .stars-copy svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  @keyframes scrollStars{
    from{ transform:translate3d(0, 0, 0); }
    to  { transform:translate3d(-50%, 0, 0); }
  }

  .c-line{
    stroke:rgba(180, 210, 255, .30);
    stroke-width:1.1;
    fill:none;
  }

  .c-star{
    fill:#ffffff;
    animation:starTwinkle 4.5s ease-in-out infinite alternate;
    transform-origin:center;
  }

  .c-star:nth-of-type(3n+1){ animation-duration:3.8s; }
  .c-star:nth-of-type(3n+2){ animation-duration:5.2s; }
  .c-star:nth-of-type(3n+3){ animation-duration:6.4s; }

  .c-star.bright{
    fill:#dde9ff;
    filter:drop-shadow(0 0 4px rgba(200, 220, 255, .85));
  }

  @keyframes starTwinkle{
    0%   { opacity:.30; }
    100% { opacity:.95; }
  }

  html[data-user-color-scheme="light"] .stars-wrap{ opacity:.85; }

  /* ===== 流星层 ===== */
  .meteors{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:2;
  }

  .meteor{
    position:absolute;
    left:0; top:0;
    width:2px; height:2px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:
      0 0 6px 1px rgba(200,225,255,.9),
      0 0 16px 4px rgba(140,180,255,.45);
    opacity:0;
    pointer-events:none;
    will-change:transform, opacity;
    transform:translate3d(var(--x0), var(--y0), 0);
    animation:meteorFall var(--dur, 1.8s) linear forwards;
  }

  .meteor::before{
    content:'';
    position:absolute;
    top:50%; left:2px;
    width:var(--tail, 140px);
    height:1.5px;
    transform-origin:left center;
    transform:translateY(-50%) rotate(var(--angle, -45deg));
    background:linear-gradient(90deg,
                rgba(255,255,255,.95) 0%,
                rgba(200,225,255,.55) 40%,
                rgba(160,200,255,0) 100%);
    border-radius:2px;
  }

  .meteor::after{
    content:'';
    position:absolute;
    left:50%; top:50%;
    width:6px; height:6px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(180,215,255,0));
  }

  @keyframes meteorFall{
    0%   { opacity:0; transform:translate3d(var(--x0), var(--y0), 0); }
    6%   { opacity:1; }
    88%  { opacity:.85; }
    100% { opacity:0; transform:translate3d(calc(var(--x0) + var(--dx)), calc(var(--y0) + var(--dy)), 0); }
  }

  /* ===== 主内容 ===== */
  .hero-inner{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero-title{
    font-family:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
    font-weight:900;
    font-size:clamp(4rem, 17vw, 9rem);
    line-height:1;
    letter-spacing:.05em;
    padding-left:.05em;
    margin-top:-30px;
    background:linear-gradient(180deg, #ffffff 0%, #a9c6ff 55%, #5b8ce0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    filter:drop-shadow(0 0 34px rgba(110, 160, 255, .42));
    animation:fadeUp 1.1s cubic-bezier(.2,.7,.3,1) both;
  }

  .welcome-wrap{
    margin-top:34px;
    font-size:clamp(1.6rem, 5.5vw, 2.6rem);
    font-weight:700;
    letter-spacing:.14em;
    padding-left:.14em;
    color:var(--hero-text);
    opacity:0;
    animation:fadeUp .8s .6s cubic-bezier(.2,.7,.3,1) forwards;
    min-height:1.6em;
    text-align:center;
    text-shadow:0 0 24px rgba(140, 180, 255, .45);
  }

  .welcome-text{ display:inline; }

  .typed-cursor{
    display:inline-block;
    margin-left:4px;
    font-weight:400;
    animation:blink 1.2s step-end infinite;
  }

  @keyframes blink{ 50%{ opacity:0; } }

  .hero-line{
    width:76px;
    height:1px;
    margin:34px auto 0;
    background:linear-gradient(90deg, transparent, #7fb0ff, transparent);
    animation:fadeUp 1.1s .25s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(24px); }
    to  { opacity:1; transform:translateY(0); }
  }

  /* ===== 向下箭头 ===== */
  .arrow-down{
    position:absolute;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    animation:scrollDownFloat 1.5s infinite;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .arrow-down svg{
    width:40px; height:40px;
    stroke:#a8dcff;
    stroke-width:2.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 10px rgba(127,196,240,.55));
  }

  @keyframes scrollDownFloat{
    0%  { opacity:.90; transform:translateX(-50%) translateY(0); }
    50% { opacity:.45; transform:translateX(-50%) translateY(-14px); }
    100%{ opacity:.90; transform:translateX(-50%) translateY(0); }
  }

  .arrow-down:hover{
    animation-play-state:paused;
    opacity:1;
  }

  .arrow-down:hover svg{
    stroke:#ffffff;
    filter:drop-shadow(0 0 18px rgba(168,220,255,1));
  }

  /* ===================== 第二屏：小工具 ===================== */
  .menu-section{
    min-height:100vh;
    padding:80px 24px 60px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:background .35s ease;
  }

  .menu-wrap{ width:100%; max-width:560px; }

  .menu-head{
    text-align:center;
    margin-bottom:44px;
  }

  .menu-head h2{
    font-size:clamp(1.6rem, 5vw, 2.1rem);
    font-weight:800;
    color:var(--text);
    letter-spacing:.04em;
  }

  .tool-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
    width:100%;
  }

  .tool-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    aspect-ratio:var(--phi) / 1;
    border:1px solid var(--border);
    border-radius:14px;
    text-decoration:none;
    color:var(--text);
    background:var(--bg-card);
    transition:border-color .35s ease, transform .35s cubic-bezier(.2,.7,.3,1),
               background .35s ease, box-shadow .35s ease;
  }

  .tool-box:hover{
    border-color:var(--text);
    transform:translateY(-5px);
    box-shadow:0 14px 34px -18px rgba(18,17,16,.35);
  }

  html[data-user-color-scheme="dark"] .tool-box:hover{
    border-color:#58a6ff;
    box-shadow:0 14px 34px -18px rgba(88,166,255,.25);
  }

  .tool-box:active{ transform:translateY(-2px); }

  .tool-box-name{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:.2em;
    padding-left:.2em;
    white-space:nowrap;
    transition:letter-spacing .35s ease;
  }

  .tool-box:hover .tool-box-name{
    letter-spacing:.26em;
    padding-left:.26em;
  }

  /* ===================== 最底部：玄寂墨羽 ===================== */
  .brand-footer{
    background:var(--bg);
    padding:26px 20px 72px;
    display:flex;
    justify-content:center;
    transition:background .35s ease;
  }

  .brand-wrap{
    position:relative;
    display:inline-block;
    padding:34px 46px;
  }

  .brand{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.06em;
    font-family:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
    font-weight:900;
    font-size:clamp(2.3rem, 9vw, 4.2rem);
    line-height:1;
    color:var(--brand-color);
    transition:color .35s ease;
  }

  .brand .char{
    display:inline-block;
    transform:rotate(var(--r)) translateY(var(--y));
  }

  .brand .c1{ --r:-8deg; --y:8px; }
  .brand .c2{ --r:6deg;  --y:-10px; }
  .brand .c3{ --r:-5deg; --y:6px; }
  .brand .c4{ --r:9deg;  --y:-6px; }

  .brand .char.outline{
    width:1em; height:1em; line-height:1;
    color:transparent;
  }

  .brand .char.outline svg{
    display:block;
    width:100%; height:100%;
    overflow:visible;
  }

  .deco{ position:absolute; pointer-events:none; }

  .d1{
    top:8px; left:0;
    width:18px; height:18px;
    border:1.5px solid var(--brand-color);
    border-radius:50%;
    transition:border-color .35s ease;
  }

  .d2{
    top:-2px; right:14px;
    width:10px; height:10px;
    background:var(--brand-color);
    transition:background .35s ease;
  }

  .d3{
    bottom:20px; left:6px;
    width:58px; height:1.5px;
    background:var(--brand-color);
    transform:rotate(-12deg) translate(-29px, 0);
    transition:background .35s ease;
  }

  .d4{
    bottom:6px; right:2px;
    width:36px; height:1.5px;
    background:var(--brand-color);
    transform:rotate(38deg);
    transition:background .35s ease;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:760px){
    .nav-links a{
      padding:6px 9px;
      font-size:.82rem;
      letter-spacing:0;
      gap:4px;
    }
    .nav-links a .iconfont{ font-size:.85rem; }
    .nav-logo{ font-size:.95rem; letter-spacing:.1em; padding-left:.1em; }
  }

  @media (max-width:520px){
    body{ padding-top:52px; }
    .site-nav{ height:52px; }
    .nav-inner{ padding:0 12px; gap:8px; }
    .nav-logo{ display:none; }
    .nav-links{ gap:0; }
    .nav-links a{ padding:6px 8px; font-size:.8rem; gap:3px; }
    .nav-links a .iconfont{ font-size:.8rem; }
    .color-toggle-btn{ width:34px; height:34px; }
    .color-toggle-btn svg{ width:20px; height:20px; }

    .arrow-down{ bottom:20px; }
    .arrow-down svg{ width:34px; height:34px; }
    .menu-section{ padding:60px 20px 50px; }
    .tool-grid{ gap:14px; }
    .tool-box{ border-radius:12px; }
    .tool-box-name{ font-size:1rem; }
    .brand-wrap{ padding:28px 30px; }
    .hero-title{ margin-top:-20px; }

    .stars-track{ animation-duration:160s; }
  }
</style>
</head>

<body>

      <ul class="nav-links">
        <li><a href="#" class="active">

        </a></li>

          <i class="iconfont icon-user-fill"></i>

          <i class="iconfont icon-link-fill"></i>

        </a></li>

          <i class="iconfont icon-note"></i>

        </a></li>
      </ul>

      <button class="color-toggle-btn" id="colorToggleBtn" aria-label="切换日夜模式">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"
                fill="#ffffff" stroke="none"/>
          <path d="M14.3 7.1a4.6 4.6 0 0 0 1.9 5.6"
                stroke="#0a0e16" stroke-width="1.6" opacity=".35"/>
          <circle cx="18.6" cy="5.6" r="1.15" fill="#ffffff" stroke="none"/>
          <circle cx="21.2" cy="9.4" r="0.75" fill="#ffffff" stroke="none"/>
        </svg>

        <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round"

          <circle cx="12" cy="12" r="4.6" fill="#ffffff" stroke="none"/>

          <line x1="1.8" y1="12" x2="4.2" y2="12"/>
          <line x1="19.8" y1="12" x2="22.2" y2="12"/>
          <line x1="4.8" y1="4.8" x2="6.5" y2="6.5"/>
          <line x1="17.5" y1="17.5" x2="19.2" y2="19.2"/>
          <line x1="19.2" y1="4.8" x2="17.5" y2="6.5"/>
          <line x1="6.5" y1="17.5" x2="4.8" y2="19.2"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ===================== 第一屏 ===================== -->
  <section class="hero">

    <div class="nebula" aria-hidden="true"></div>

    <div class="stars-wrap" aria-hidden="true">
      <div class="stars-track" id="starsTrack">
        <div class="stars-copy" id="starsCopy">
          <svg viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid slice">

            <g fill="#ffffff" opacity=".55">
              <circle cx="60"   cy="120" r="0.9"/>
              <circle cx="140"  cy="380" r="0.7"/>
              <circle cx="220"  cy="620" r="1"/>

<script>
"use strict";

(function(){
  var track = document.getElementById('starsTrack');
  var first = document.getElementById('starsCopy');
  if(!track || !first) return;

  var clone = first.cloneNode(true);
  clone.removeAttribute('id');
  track.appendChild(clone);
})();

(function(){
  var el = document.getElementById('welcomeText');
  if(!el) return;
  var text = '欢迎来到星空';
  var i = 0;
  function type(){
    if(i < text.length){
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, 200 + Math.random() * 80);
    }
  }
  setTimeout(type, 900);
})();

(function(){
  var container = document.getElementById('meteors');
  if(!container) return;

  if(window.matchMedia &&
     window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    return;
  }

  var INTERVAL = 5000;

  function spawnMeteor(){
    var w = window.innerWidth;
    var h = window.innerHeight;

    var x0 = w * (0.55 + Math.random() * 0.55);
    var y0 = h * (-0.15 + Math.random() * 0.50);

    var angleDeg = 35 + Math.random() * 20;
    var angleRad = angleDeg * Math.PI / 180;

    var dxNeed = x0 + 0.25 * w;
    var dyNeed = 1.25 * h - y0;
    var distByX = dxNeed / Math.cos(angleRad);
    var distByY = dyNeed / Math.sin(angleRad);
    var dist = Math.max(distByX, distByY) + 60;

    var dx = -dist * Math.cos(angleRad);
    var dy =  dist * Math.sin(angleRad);

    var speed = 900 + Math.random() * 500;
    var dur = Math.max(1.2, dist / speed);
    var tail = Math.max(90, Math.min(220, dist * 0.10 + Math.random() * 60));

    var m = document.createElement('span');
    m.className = 'meteor';
    m.style.setProperty('--x0', x0 + 'px');
    m.style.setProperty('--y0', y0 + 'px');
    m.style.setProperty('--dx', dx + 'px');
    m.style.setProperty('--dy', dy + 'px');
    m.style.setProperty('--dur', dur.toFixed(2) + 's');
    m.style.setProperty('--tail', tail.toFixed(0) + 'px');
    m.style.setProperty('--angle', (-angleDeg) + 'deg');

    container.appendChild(m);

    setTimeout(function(){
      if(m.parentNode) m.parentNode.removeChild(m);
    }, dur * 1000 + 300);
  }

  setTimeout(spawnMeteor, 1200);
  setInterval(spawnMeteor, INTERVAL);
})();

(function(){
  var root = document.documentElement;
  var btn = document.getElementById('colorToggleBtn');
  var STORAGE_KEY = 'Fluid_Color_Scheme';
  var ATTR = 'data-user-color-scheme';

  function getLS(){
    try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
  }
  function setLS(v){
    try{ localStorage.setItem(STORAGE_KEY, v); }catch(e){}
  }
  function removeLS(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }

  function getDefault(){ return 'dark'; }

  function apply(schema){
    var current = schema || getLS() || getDefault();
    if(current !== 'dark' && current !== 'light') current = getDefault();

    if(current === getDefault()){
      root.setAttribute(ATTR, getDefault());
      removeLS();
    } else {
      root.setAttribute(ATTR, current);
    }
  }

  function toggle(){
    var cur = root.getAttribute(ATTR) || getDefault();
    var next = (cur === 'dark') ? 'light' : 'dark';
    setLS(next);
    apply(next);
  }

  apply();
  if(btn) btn.addEventListener('click', toggle);
})();

function fastScrollTo(targetY, duration) {
    const startY = window.pageYOffset;
    const distance = targetY - startY;
    let startTime = null;
    function easeOutExpo(t) {
        return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }
    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        window.scrollTo(0, startY + distance * easeOutExpo(progress));
        if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

const menuEl = document.getElementById('menu');
const arrowDown = document.getElementById('arrowDown');
let scrollLock = false;
let lockTimer = null;

function lockScroll(ms) {
    scrollLock = true;
    clearTimeout(lockTimer);
    lockTimer = setTimeout(() => { scrollLock = false; }, ms);
}
function menuTop() {
    return menuEl.getBoundingClientRect().top + window.pageYOffset;
}
function goToMenu() {
    if (scrollLock) return;
    lockScroll(1000);
    fastScrollTo(menuTop(), 800);
}
function goToHome() {
    if (scrollLock) return;
    lockScroll(1000);
    fastScrollTo(0, 800);
}

arrowDown.addEventListener('click', goToMenu);

window.addEventListener('wheel', function (e) {
    if (scrollLock) { e.preventDefault(); return; }
    const y = window.pageYOffset;
    const mt = menuTop();
    if (y < mt * 0.3 && e.deltaY > 0) { e.preventDefault(); goToMenu(); return; }
    if (Math.abs(y - mt) < 30 && e.deltaY < 0) { e.preventDefault(); goToHome(); return; }
}, { passive: false });

let touchStartY = 0;
let touchTriggered = false;
window.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
    touchTriggered = false;
}, { passive: true });
window.addEventListener('touchmove', function (e) {
    if (scrollLock) { e.preventDefault(); return; }
    if (touchTriggered) return;
    const y = window.pageYOffset;
    const mt = menuTop();
    const dy = touchStartY - e.touches[0].clientY;
    if (y < mt * 0.3 && dy > 14) { e.preventDefault(); touchTriggered = true; goToMenu(); return; }
    if (Math.abs(y - mt) < 30 && dy < -14) { e.preventDefault(); touchTriggered = true; goToHome(); return; }
}, { passive: false });
</script>
