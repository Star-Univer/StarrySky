<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>玄寂墨羽</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink:#121110;
    --paper:#ffffff;
    --muted:#8a857d;
    --faint:#e6e4e0;
    --phi:1.618;          /* 黄金比例 */
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  ::selection{ background:var(--ink); color:var(--paper); }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== 顶部标题区 ===== */
  .title-block{
    padding:clamp(56px, 12vh, 120px) 20px 0;
    display:flex;
    justify-content:center;
  }

  .title-wrap{
    position:relative;
    display:inline-block;
    padding:34px 44px;
  }

  .title{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0.06em;
    font-family:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
    font-weight:900;
    font-size:clamp(2.7rem, 12vw, 6rem);
    line-height:1;
  }

  .char{
    display:inline-block;
    transform:rotate(var(--r)) translateY(var(--y));
    animation:enter 1s cubic-bezier(.2,.7,.3,1) backwards;
  }

  .c1{ --r:-8deg; --y:8px;   animation-delay:.05s; }
  .c2{ --r:6deg;  --y:-10px; animation-delay:.14s; }
  .c3{ --r:-5deg; --y:6px;   animation-delay:.23s; }
  .c4{ --r:9deg;  --y:-6px;  animation-delay:.32s; }

  .char.solid{ color:var(--ink); }

  .char.outline{
    display:inline-block;
    width:1em;
    height:1em;
    line-height:1;
  }

  .char.outline svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
  }

  @keyframes enter{
    from{
      opacity:0;
      transform:rotate(0deg) translateY(34px) scale(.92);
    }
    to{
      opacity:1;
      transform:rotate(var(--r)) translateY(var(--y)) scale(1);
    }
  }

  /* 几何装饰 */
  .deco{
    position:absolute;
    pointer-events:none;
    animation:decoIn 1.1s cubic-bezier(.2,.7,.3,1) backwards;
  }

  @keyframes decoIn{
    from{ opacity:0; }
    to  { opacity:1; }
  }

  .d1{
    top:10px; left:0;
    width:14px; height:14px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    animation-delay:.65s;
  }

  .d2{
    top:0; right:12px;
    width:8px; height:8px;
    background:var(--ink);
    animation-delay:.75s;
  }

  .d3{
    bottom:16px; left:4px;
    width:46px; height:1.5px;
    background:var(--ink);
    /* 沿棍自身方向朝左下平移半个棍长（46px / 2 = 23px） */
    transform:rotate(-12deg) translate(-23px, 0);
    animation-delay:.85s;
  }

  .d4{
    bottom:4px; right:2px;
    width:28px; height:1.5px;
    background:var(--ink);
    transform:rotate(38deg);
    animation-delay:.95s;
  }

  /* ===== 下方：提示文字 + 工具按钮 ===== */
  .tools{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(52px, 9vh, 96px) 24px 120px;
  }

  .hint-label{
    margin:0 0 28px;
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.3em;
    padding-left:.3em;
    color:var(--muted);
    animation:rise .8s .3s cubic-bezier(.2,.7,.3,1) backwards;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to  { opacity:1; transform:none; }
  }

  /* 工具卡片容器：2 列网格 */
  .tool-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
    width:100%;
    max-width:458px;   /* 220 + 18 + 220 */
  }

  /* 每个按钮 = 黄金比例长方形（宽 : 高 = 1.618 : 1） */
  .tool-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    aspect-ratio:var(--phi) / 1;
    border:1px solid var(--faint);
    border-radius:14px;
    text-decoration:none;
    color:var(--ink);
    background:transparent;
    transition:border-color .35s ease, transform .35s cubic-bezier(.2,.7,.3,1),
               background .35s ease, box-shadow .35s ease;
    animation:rise .9s cubic-bezier(.2,.7,.3,1) backwards;
  }

  .tool-box:nth-child(1){ animation-delay:.42s; }
  .tool-box:nth-child(2){ animation-delay:.52s; }
  .tool-box:nth-child(3){ animation-delay:.62s; }

  .tool-box:hover{
    border-color:var(--ink);
    transform:translateY(-5px);
    background:#fcfcfb;
    box-shadow:0 14px 34px -18px rgba(18,17,16,.35);
  }

  .tool-box:active{
    transform:translateY(-2px);
  }

  .tool-box-name{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:.2em;
    padding-left:.2em;
    white-space:nowrap;
    transition:letter-spacing .35s ease;
  }

  .tool-box:hover .tool-box-name{
    letter-spacing:.26em;
    padding-left:.26em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:520px){
    .title-wrap{ padding:28px 26px; }
    .tool-grid{ gap:14px; }
    .tool-box{ border-radius:12px; }
    .tool-box-name{ font-size:1rem; }
  }
</style>
</head>

<body>
  <div class="page">

    <!-- 顶部：玄寂墨羽 -->
    <header class="title-block">
      <div class="title-wrap">
        <h1 class="title">
          <span class="char solid c1">玄</span>

          <span class="char outline c2">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
                    font-family="'Noto Sans SC', sans-serif" font-weight="900"
                    font-size="94" filter="url(#outlineOnly)">寂</text>
            </svg>
          </span>

          <span class="char solid c3">墨</span>

          <span class="char outline c4">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
                    font-family="'Noto Sans SC', sans-serif" font-weight="900"
                    font-size="94" filter="url(#outlineOnly)">羽</text>
            </svg>
          </span>
        </h1>

        <span class="deco d1"></span>
        <span class="deco d2"></span>
        <span class="deco d3"></span>
        <span class="deco d4"></span>
      </div>
    </header>

    <!-- 下方：提示文字 + 工具按钮 -->
    <main class="tools">

      <p class="hint-label">小工具</p>

      <div class="tool-grid">

        <a class="tool-box" href="比分计数.html" aria-label="进入比分计数工具">
          <span class="tool-box-name">比分计数</span>
        </a>

        <a class="tool-box" href="八字排盘.html" aria-label="进入八字排盘工具">
          <span class="tool-box-name">八字排盘</span>
        </a>

        <a class="tool-box" href="数独推理.html" aria-label="进入数独推理工具">
          <span class="tool-box-name">数独推理</span>
        </a>

      </div>

    </main>

  </div>

  <!-- SVG 滤镜：只保留笔画外轮廓 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="outlineOnly" x="-30%" y="-30%" width="160%" height="160%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="dilated"/>
        <feComposite in="dilated" in2="SourceAlpha" operator="out" result="ring"/>
        <feFlood flood-color="#121110" result="ink"/>
        <feComposite in="ink" in2="ring" operator="in"/>
      </filter>
    </defs>
  </svg>

</body>
</html>
