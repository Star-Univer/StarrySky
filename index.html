<!DOCTYPE html>
<html lang="zh-CN" data-default-color-scheme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星空</title>

<!-- 内联 SVG 图标：不依赖任何文件，一定显示 -->

<!-- 如果你之后准备好了自己的图标文件，把它们放在 index.html 同目录，浏览器会自动优先使用下面的 -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&display=swap" rel="stylesheet" />

<style>
  :root{
    --ink:#121110;
    --bg:#edf1f7;
    --bg-card:#ffffff;
    --border:#dde5ef;
    --text:#0f1b2b;
    --text-muted:#6a819a;
    --brand-color:#121110;
    --phi:1.618;

    --page-bg:rgba(237,241,247,.88);
    --card-bg:rgba(255,255,255,.72);

    --hero-bg:radial-gradient(ellipse at 20% 15%,
              rgba(27,58,99,.55) 0%,
              rgba(12,26,48,.72) 40%,
              rgba(5,8,15,.86) 100%);
    --hero-text:#ffffff;
    --title-grad:linear-gradient(180deg,#ffffff 0%,#a9c6ff 55%,#5b8ce0 100%);
    --title-glow:drop-shadow(0 0 34px rgba(110,160,255,.42));

    --sky:radial-gradient(ellipse at 50% 100%, #143d5c 0%, #0a1d3a 35%, #050a14 70%, #010306 100%);

    --nav-bg:#0a0e16;
    --nav-text:#f0f2f6;
    --nav-hover:rgba(255,255,255,.10);
    --nav-active-bg:rgba(255,255,255,.16);
    --nav-border:rgba(255,255,255,.08);

    --bili:#00AEEC;
    --glass-bg:linear-gradient(155deg,
                rgba(255,255,255,.86) 0%,
                rgba(255,255,255,.62) 45%,
                rgba(255,255,255,.78) 100%);
    --glass-border:rgba(255,255,255,.95);
    --glass-shadow:0 26px 60px -30px rgba(20,45,90,.42);
    --glass-inset:inset 0 1px 0 rgba(255,255,255,.95);
    --glass-head-border:rgba(15,27,43,.10);
    --glass-title:#0f1b2b;
    --glass-sub:rgba(60,90,130,.55);
    --glass-item-bg:rgba(255,255,255,.60);
    --glass-item-border:rgba(15,27,43,.10);
    --glass-item-text:#0f1b2b;
    --glass-item-desc:rgba(60,90,130,.68);
    --glass-foot:rgba(60,90,130,.55);
    --glass-ico-bg:linear-gradient(145deg, rgba(0,174,236,.20), rgba(0,174,236,.06));
    --glass-ico-border:rgba(0,174,236,.35);
    --glass-arrow:#4a6f9c;
  }

  html[data-user-color-scheme="dark"]{
    --ink:#e8eaf0;
    --bg:#111b2c;
    --bg-card:#0d1626;
    --border:#1b2a42;
    --text:#e8eaf0;
    --text-muted:#8b9bb4;
    --brand-color:#e8eaf0;

    --page-bg:rgba(17,27,44,.86);
    --card-bg:rgba(13,22,38,.62);

    --hero-bg:radial-gradient(ellipse at 50% 100%,
              rgba(20,61,92,.55) 0%,
              rgba(10,29,58,.72) 35%,
              rgba(5,10,20,.86) 70%,
              rgba(1,3,6,.92) 100%);

    --glass-bg:linear-gradient(155deg,
                rgba(255,255,255,.18) 0%,
                rgba(255,255,255,.07) 45%,
                rgba(255,255,255,.12) 100%);
    --glass-border:rgba(255,255,255,.24);
    --glass-shadow:0 30px 70px -26px rgba(0,0,0,.85);
    --glass-inset:inset 0 1px 0 rgba(255,255,255,.42);
    --glass-head-border:rgba(255,255,255,.14);
    --glass-title:#ffffff;
    --glass-sub:rgba(210,226,255,.55);
    --glass-item-bg:rgba(255,255,255,.06);
    --glass-item-border:rgba(255,255,255,.12);
    --glass-item-text:#eef4ff;
    --glass-item-desc:rgba(200,218,245,.60);
    --glass-foot:rgba(190,208,238,.48);
    --glass-ico-bg:linear-gradient(145deg, rgba(0,174,236,.30), rgba(0,174,236,.10));
    --glass-ico-border:rgba(0,174,236,.42);
    --glass-arrow:#cfe2ff;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    padding-top:56px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background .35s ease, color .35s ease;
  }

  ::selection{ background:var(--ink); color:var(--bg); }

  /* ===================== 顶部导航栏 ===================== */
  .site-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:300;
    height:56px;
    display:flex;
    align-items:center;
    background:var(--nav-bg);
    border-bottom:1px solid var(--nav-border);
  }

  .nav-inner{
    width:100%;
    max-width:1080px;
    margin:0 auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  /* ===== 网站 Logo：内联 SVG 星星 + 渐变文字（不依赖图片） ===== */
  .nav-logo{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
    user-select:none;
  }
  .nav-logo-star{
    width:30px;
    height:30px;
    display:block;
    flex-shrink:0;
    filter:drop-shadow(0 0 9px rgba(140,170,255,.70));
  }
  .nav-logo-text{
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",
                "Microsoft YaHei",sans-serif;
    font-weight:900;
    font-size:1.05rem;
    letter-spacing:.16em;
    padding-left:.16em;
    white-space:nowrap;
    background:linear-gradient(135deg,#ff9aec 0%,#a9c6ff 50%,#5b8ce0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  .nav-links{
    display:flex;
    align-items:center;
    gap:2px;
    list-style:none;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .nav-links::-webkit-scrollbar{ display:none; }

  .nav-links a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:9px;
    font-size:.9rem;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--nav-text);
    text-decoration:none;
    white-space:nowrap;
    opacity:.85;
    transition:background .2s ease, opacity .2s ease;
    cursor:pointer;
  }
  .nav-links a:hover{ background:var(--nav-hover); opacity:1; }
  .nav-links a.active{ background:var(--nav-active-bg); opacity:1; font-weight:700; }

  /* ===== 导航图标：内联 SVG ===== */
  .nav-ico{
    flex:0 0 auto;
    width:1.05em;
    height:1.05em;
    display:block;
    fill:none;
    stroke:#ffffff;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.9;
    transition:opacity .2s ease, transform .2s ease;
  }
  .nav-links a:hover .nav-ico{ opacity:1; transform:scale(1.10); }

  /* ===== 日夜切换按钮 ===== */
  .color-toggle-btn{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:#ffffff;
    cursor:pointer;
    padding:0;
    transition:background .25s ease, transform .25s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .color-toggle-btn:hover{ background:rgba(255,255,255,.12); transform:scale(1.10) rotate(-8deg); }
  .color-toggle-btn:active{ transform:scale(.92); }
  .color-toggle-btn svg{ display:none; width:23px; height:23px; overflow:visible; }
  html[data-user-color-scheme="dark"] .icon-moon{ display:block; }
  html[data-user-color-scheme="light"] .icon-sun{ display:block; }

  /* ===================== 全局星空背景层 ===================== */
  .sky{
    position:fixed;
    inset:-12%;
    z-index:0;
    background:var(--sky);
    transform:scale(1.12);
    transition:transform 1.05s cubic-bezier(.76,0,.24,1), background .5s ease;
    will-change:transform;
    pointer-events:none;
    backface-visibility:hidden;
  }

  .nebula{
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 12% 22%, rgba(30,80,160,.25), transparent 42%),
      radial-gradient(circle at 80% 60%, rgba(70,50,150,.20), transparent 48%),
      radial-gradient(circle at 40% 90%, rgba(20,120,180,.18), transparent 45%),
      radial-gradient(circle at 92% 15%, rgba(40,70,140,.22), transparent 38%),
      radial-gradient(circle at 55% 35%, rgba(100,80,180,.10), transparent 40%);
    filter:blur(24px);
    animation:nebulaDrift 60s ease-in-out infinite alternate;
  }
  html[data-user-color-scheme="dark"] .nebula{ filter:blur(28px); opacity:.95; }

  @keyframes nebulaDrift{
    0%  { transform:translate3d(0,0,0) scale(1); }
    100%{ transform:translate3d(-2%,1.5%,0) scale(1.06); }
  }

  .stars-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }

  .stars-track{
    position:absolute;
    top:0; left:0;
    width:200%;
    height:100%;
    display:flex;
    animation:scrollStars 110s linear infinite;
    will-change:transform;
  }

  .stars-copy{ flex:0 0 50%; height:100%; position:relative; }
  .stars-copy svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  @keyframes scrollStars{
    from{ transform:translate3d(0,0,0); }
    to  { transform:translate3d(-50%,0,0); }
  }

  .c-line{ stroke:rgba(180,210,255,.30); stroke-width:1.1; fill:none; }
  .c-star{
    fill:#ffffff;
    animation:starTwinkle 4.5s ease-in-out infinite alternate;
    transform-origin:center;
  }
  .c-star:nth-of-type(3n+1){ animation-duration:3.8s; }
  .c-star:nth-of-type(3n+2){ animation-duration:5.2s; }
  .c-star:nth-of-type(3n+3){ animation-duration:6.4s; }
  .c-star.bright{ fill:#dde9ff; filter:drop-shadow(0 0 4px rgba(200,220,255,.85)); }

  @keyframes starTwinkle{
    0%{ opacity:.30; }
    100%{ opacity:.95; }
  }

  .meteors{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }

  .meteor{
    position:absolute;
    left:0; top:0;
    width:2px; height:2px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:
      0 0 6px 1px rgba(200,225,255,.9),
      0 0 16px 4px rgba(140,180,255,.45);
    opacity:0;
    pointer-events:none;
    will-change:transform, opacity;
    transform:translate3d(var(--x0), var(--y0), 0);
    animation:meteorFall var(--dur,1.8s) linear forwards;
  }

  .meteor::before{
    content:'';
    position:absolute;
    top:50%; left:2px;
    width:var(--tail,140px);
    height:1.5px;
    transform-origin:left center;
    transform:translateY(-50%) rotate(var(--angle,-45deg));
    background:linear-gradient(90deg,
                rgba(255,255,255,.95) 0%,
                rgba(200,225,255,.55) 40%,
                rgba(160,200,255,0) 100%);
    border-radius:2px;
  }

  .meteor::after{
    content:'';
    position:absolute;
    left:50%; top:50%;
    width:6px; height:6px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(180,215,255,0));
  }

  @keyframes meteorFall{
    0%  { opacity:0; transform:translate3d(var(--x0), var(--y0), 0); }
    6%  { opacity:1; }
    88% { opacity:.85; }
    100%{ opacity:0; transform:translate3d(calc(var(--x0) + var(--dx)), calc(var(--y0) + var(--dy)), 0); }
  }

  /* ===================== 横向页面舞台 ===================== */
  .stage{
    position:relative;
    z-index:2;
    height:calc(100vh - 56px);
    overflow:hidden;
  }

  .track{
    display:flex;
    height:100%;
    transform:translate3d(0,0,0);
    transition:transform .9s cubic-bezier(.76,0,.24,1);
    will-change:transform;
  }

  .page{
    flex:0 0 100%;
    width:100%;
    height:100%;
    position:relative;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    opacity:1;
    filter:blur(8px);
    transform:scale(.985);
    transition:filter .55s ease, transform .55s ease;
    background:var(--page-bg);
  }
  .page::-webkit-scrollbar{ display:none; }

  .page[data-page="home"],
  .page[data-page="friend"]{ background:transparent; }

  .page.active{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }

  /* ===================== 第一屏：星空 ===================== */
  .hero{
    position:relative;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:clamp(40px,9vh,100px) 24px 120px;
    overflow:hidden;
    background:var(--hero-bg);
    color:var(--hero-text);
    transition:background .5s ease;
  }

  .hero-inner{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero-title{
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",
                "Microsoft YaHei",sans-serif;
    font-weight:900;
    font-size:clamp(2.4rem,10vw,5.2rem);
    line-height:1;
    letter-spacing:.05em;
    padding-left:.05em;
    margin-top:-70px;
    background:var(--title-grad);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    filter:var(--title-glow);
    animation:fadeUp 1.1s cubic-bezier(.2,.7,.3,1) both;
  }

  .hero-line{
    width:76px; height:1px;
    margin:34px auto 0;
    background:linear-gradient(90deg, transparent, #7fb0ff, transparent);
    animation:fadeUp 1.1s .25s cubic-bezier(.2,.7,.3,1) both;
  }

  .welcome-stage{
    position:absolute;
    left:0; right:0;
    top:43%;
    transform:translateY(-50%);
    z-index:3;
    display:flex;
    justify-content:center;
    padding:0 24px;
    pointer-events:none;
  }

  .welcome-wrap{
    font-size:clamp(3.2rem,13vw,6.8rem);
    font-weight:800;
    letter-spacing:.16em;
    padding-left:.16em;
    line-height:1.1;
    color:var(--hero-text);
    opacity:0;
    animation:fadeUp .8s .6s cubic-bezier(.2,.7,.3,1) forwards;
    text-align:center;
    text-shadow:0 0 30px rgba(140,180,255,.5);
    white-space:nowrap;
  }

  .typed-cursor{
    display:inline-block;
    margin-left:4px;
    font-weight:400;
    animation:blink 1.2s step-end infinite;
  }

  @keyframes blink{ 50%{ opacity:0; } }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(24px); }
    to  { opacity:1; transform:translateY(0); }
  }

  .arrow-down{
    position:absolute;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    z-index:60;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    animation:scrollDownFloat 1.5s infinite;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .arrow-down svg{
    width:40px; height:40px;
    stroke:#a8dcff;
    stroke-width:2.2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 10px rgba(127,196,240,.55));
  }

  @keyframes scrollDownFloat{
    0%  { opacity:.90; transform:translateX(-50%) translateY(0); }
    50% { opacity:.45; transform:translateX(-50%) translateY(-14px); }
    100%{ opacity:.90; transform:translateX(-50%) translateY(0); }
  }

  .arrow-down:hover{ animation-play-state:paused; opacity:1; }
  .arrow-down:hover svg{ stroke:#ffffff; filter:drop-shadow(0 0 18px rgba(168,220,255,1)); }

  /* ===================== 第二屏：小工具 ===================== */
  .menu-section{
    min-height:100%;
    padding:80px 24px 60px;
    background:var(--page-bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:background .35s ease;
  }

  .menu-wrap{ width:100%; max-width:560px; }

  .menu-head{ text-align:center; margin-bottom:44px; }

  .menu-head h2{
    font-size:clamp(1.6rem,5vw,2.1rem);
    font-weight:800;
    color:var(--text);
    letter-spacing:.04em;
  }

  .tool-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    width:100%;
  }

  .tool-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    aspect-ratio:var(--phi) / 1;
    border:1px solid var(--border);
    border-radius:14px;
    text-decoration:none;
    color:var(--text);
    background:var(--bg-card);
    transition:border-color .35s ease, transform .35s cubic-bezier(.2,.7,.3,1),
               background .35s ease, box-shadow .35s ease;
  }

  .tool-box:hover{
    border-color:var(--text);
    transform:translateY(-5px);
    box-shadow:0 14px 34px -18px rgba(18,17,16,.35);
  }

  html[data-user-color-scheme="dark"] .tool-box:hover{
    border-color:#58a6ff;
    box-shadow:0 14px 34px -18px rgba(88,166,255,.25);
  }

  .tool-box:active{ transform:translateY(-2px); }

  .tool-box-name{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:.2em;
    padding-left:.2em;
    white-space:nowrap;
    transition:letter-spacing .35s ease;
  }
  .tool-box:hover .tool-box-name{ letter-spacing:.26em; padding-left:.26em; }

  /* ===================== 普通内页 ===================== */
  .page-inner{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:90px 24px 70px;
  }

  .page-title{
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",
                "Microsoft YaHei",sans-serif;
    font-size:clamp(2rem,7vw,3rem);
    font-weight:900;
    letter-spacing:.14em;
    padding-left:.14em;
    color:var(--text);
  }

  .page-sub{
    color:var(--text-muted);
    font-size:.92rem;
    letter-spacing:.14em;
  }

  /* ===================== 友链：玻璃卡片 ===================== */
  .friend-stage{
    position:relative;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 20px 84px;
  }

  .glass-card{
    position:relative;
    z-index:5;
    width:min(92vw,470px);
    padding:26px 24px 24px;
    border-radius:30px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow), var(--glass-inset);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    overflow:hidden;
  }

  .glass-card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(160deg,
                rgba(255,255,255,.34) 0%,
                rgba(255,255,255,0) 46%);
    pointer-events:none;
    opacity:.75;
  }
  html[data-user-color-scheme="dark"] .glass-card::before{
    background:linear-gradient(160deg,
                rgba(255,255,255,.28) 0%,
                rgba(255,255,255,0) 46%);
    opacity:.7;
  }

  .glass-card::after{
    content:'';
    position:absolute;
    left:-40%;
    top:-60%;
    width:80%;
    height:200%;
    background:radial-gradient(circle, rgba(255,255,255,.16), transparent 62%);
    transform:rotate(18deg);
    pointer-events:none;
    opacity:0;
  }
  .page.active .glass-card::after{
    animation:glassSheen 9s ease-in-out infinite;
  }

  @keyframes glassSheen{

    to  { opacity:1; transform:translateY(0) scale(1); }

  .glass-head{
    position:relative;
    z-index:2;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:2px 6px 16px;
    border-bottom:1px solid var(--glass-head-border);
    margin-bottom:14px;

  .glass-title{
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",
                "Microsoft YaHei",sans-serif;
    font-size:1.28rem;
    font-weight:900;
    letter-spacing:.22em;
    padding-left:.22em;
    color:var(--glass-title);
  }
  html[data-user-color-scheme="dark"] .glass-title{
    text-shadow:0 0 22px rgba(130,180,255,.55);
  }

  .glass-sub{
    font-size:.66rem;
    letter-spacing:.26em;
    padding-left:.26em;
    color:var(--glass-sub);
    text-transform:uppercase;
  }

  .link-list{
    position:relative;
    z-index:2;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .link-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    border-radius:18px;
    text-decoration:none;
    color:var(--glass-item-text);
    background:var(--glass-item-bg);
    border:1px solid var(--glass-item-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
    transition:background .3s ease, border-color .3s ease,
               transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .link-item:hover{
    background:rgba(120,185,255,.16);
    border-color:rgba(120,185,255,.60);
    transform:translateY(-3px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      0 14px 30px -16px rgba(90,160,255,.85);
  }

  .link-item:active{ transform:translateY(-1px) scale(.99); }

  .link-ico{
    flex:0 0 auto;
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:var(--glass-ico-bg);
    border:1px solid var(--glass-ico-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
    transition:background .3s ease, transform .3s ease, box-shadow .3s ease;
  }

  .link-ico svg{
    width:24px;
    height:24px;
    fill:var(--bili);
    filter:drop-shadow(0 0 6px rgba(0,174,236,.55));
    transition:fill .3s ease, transform .3s ease;
  }

  .link-item:hover .link-ico{
    background:linear-gradient(145deg, rgba(0,174,236,.48), rgba(0,174,236,.20));
    transform:scale(1.06);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.34),
      0 0 18px -2px rgba(0,174,236,.75);
  }

  .link-item:hover .link-ico svg{ fill:#7fdcff; }

  .link-meta{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }

  .link-name{
    font-size:.98rem;
    font-weight:700;
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    font-size:.74rem;
    letter-spacing:.16em;
    padding-left:.16em;

    height:22px;

    justify-content:center;

    line-height:1;
    color:var(--brand-color);
    transition:color .35s ease;
  }

  .brand .char{ display:inline-block; transform:rotate(var(--r)) translateY(var(--y)); }
  .brand .c1{ --r:-8deg; --y:8px; }
  .brand .c2{ --r:6deg;  --y:-10px; }
  .brand .c3{ --r:-5deg; --y:6px; }
  .brand .c4{ --r:9deg;  --y:-6px; }

  .brand .char.outline{ width:1em; height:1em; line-height:1; color:transparent; }
  .brand .char.outline svg{ display:block; width:100%; height:100%; overflow:visible; }

  .deco{ position:absolute; pointer-events:none; }

  .d1{
    top:8px; left:0;
    width:18px; height:18px;
    border:1.5px solid var(--brand-color);
    border-radius:50%;
    transition:border-color .35s ease;
  }
  .d2{
    top:-2px; right:14px;
    width:10px; height:10px;
    background:var(--brand-color);
    transition:background .35s ease;
  }
  .d3{
    bottom:20px; left:6px;
    width:58px; height:1.5px;
    background:var(--brand-color);
    transform:rotate(-12deg) translate(-29px,0);
    transition:background .35s ease;
  }
  .d4{
    bottom:6px; right:2px;
    width:36px; height:1.5px;
    background:var(--brand-color);
    transform:rotate(38deg);
    transition:background .35s ease;
  }

<script>
"use strict";

/* ========== 星宿复制一份，形成无缝横向滚动 ========== */
(function(){
  var track = document.getElementById('starsTrack');
  var first = document.getElementById('starsCopy');
  if(!track || !first) return;

  var clone = first.cloneNode(true);
  clone.removeAttribute('id');
  track.appendChild(clone);
})();

/* ========== 欢迎语打字机：只打“欢迎” ========== */
(function(){
  var el = document.getElementById('welcomeText');
  if(!el) return;
  var text = '欢迎';
  var i = 0;
  function type(){
    if(i < text.length){
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, 200 + Math.random() * 80);
    }
  }
  setTimeout(type, 900);
})();

/* ========== 流星 ========== */
(function(){
  var container = document.getElementById('meteors');
  if(!container) return;

  if(window.matchMedia &&
     window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var INTERVAL = 5000;

  function spawnMeteor(){
    var w = window.innerWidth;
    var h = window.innerHeight;

    var ox = w * 0.10;
    var oy = h * 0.10;

    var x0 = ox + w * (0.55 + Math.random() * 0.55);
    var y0 = oy + h * (-0.15 + Math.random() * 0.50);

    var angleDeg = 35 + Math.random() * 20;
    var angleRad = angleDeg * Math.PI / 180;

    var dxNeed = x0 + 0.25 * w;
    var dyNeed = 1.25 * h - y0;
    var distByX = dxNeed / Math.cos(angleRad);
    var distByY = dyNeed / Math.sin(angleRad);
    var dist = Math.max(distByX, distByY) + 60;

    var dx = -dist * Math.cos(angleRad);
    var dy =  dist * Math.sin(angleRad);

    var speed = 900 + Math.random() * 500;
    var dur = Math.max(1.2, dist / speed);
    var tail = Math.max(90, Math.min(220, dist * 0.10 + Math.random() * 60));

    var m = document.createElement('span');
    m.className = 'meteor';
    m.style.setProperty('--x0', x0 + 'px');
    m.style.setProperty('--y0', y0 + 'px');
    m.style.setProperty('--dx', dx + 'px');
    m.style.setProperty('--dy', dy + 'px');
    m.style.setProperty('--dur', dur.toFixed(2) + 's');
    m.style.setProperty('--tail', tail.toFixed(0) + 'px');
    m.style.setProperty('--angle', (-angleDeg) + 'deg');

    container.appendChild(m);

    setTimeout(function(){
      if(m.parentNode) m.parentNode.removeChild(m);
    }, dur * 1000 + 300);
  }

  setTimeout(spawnMeteor, 1200);
  setInterval(spawnMeteor, INTERVAL);
})();

/* ========== 日夜模式 ========== */
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('colorToggleBtn');
  var STORAGE_KEY = 'Fluid_Color_Scheme';
  var ATTR = 'data-user-color-scheme';

  function getLS(){
    try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
  }
  function setLS(v){ try{ localStorage.setItem(STORAGE_KEY, v); }catch(e){} }
  function removeLS(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

  function getDefault(){ return 'dark'; }

  function apply(schema){
    var current = schema || getLS() || getDefault();
    if(current !== 'dark' && current !== 'light') current = getDefault();

    if(current === getDefault()){
      root.setAttribute(ATTR, getDefault());
      removeLS();
    } else {
      root.setAttribute(ATTR, current);
    }
  }

  function toggle(){
    var cur = root.getAttribute(ATTR) || getDefault();
    var next = (cur === 'dark') ? 'light' : 'dark';
    setLS(next);
    apply(next);
  }

  apply();
  if(btn) btn.addEventListener('click', toggle);
})();

/* ========== 横向页面跳转 + 星宿联动 ========== */
(function(){
  var track   = document.getElementById('track');
  var sky     = document.getElementById('sky');
  var pages   = Array.prototype.slice.call(track.querySelectorAll('.page'));
  var navLinks= Array.prototype.slice.call(document.querySelectorAll('.nav-links a'));

  var cur = 0;
  var lock = false;
  var REVEAL_MS = 520;

  function applySky(i){
    sky.style.transform =
      'translate3d(' + (-i * 2.2) + 'vw,' +
                       (-i * 0.5) + 'vh,0) ' +
      'rotate(' + (-i * 0.9) + 'deg) ' +
      'scale(1.12)';
  }

  function setNav(i){
    navLinks.forEach(function(a, k){
      a.classList.toggle('active', k === i);
    });
  }

  function go(i){
    if(i < 0 || i >= pages.length) return;

    if(i === cur){
      pages[i].scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if(lock) return;

    lock = true;

    pages.forEach(function(p){ p.classList.remove('active'); });
    setNav(i);

    track.style.transform = 'translate3d(' + (-i * 100) + '%,0,0)';
    applySky(i);

    setTimeout(function(){
      pages[i].classList.add('active');
      lock = false;
    }, REVEAL_MS);

    cur = i;
  }

  navLinks.forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      go(parseInt(a.getAttribute('data-index'), 10));
    });
  });

  applySky(0);
  pages[0].classList.add('active');

  window.addEventListener('resize', function(){ applySky(cur); });
})();

/* ========== 首页 ↔ 小工具：上下翻动 ========== */
(function(){
  var home  = document.querySelector('.page[data-page="home"]');
  var menu  = document.getElementById('menu');
  var arrow = document.getElementById('arrowDown');
  if(!home || !menu || !arrow) return;

  var scrollLock = false;
  var lockTimer  = null;

  function lockScroll(ms){
    scrollLock = true;
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function(){ scrollLock = false; }, ms);
  }

  function menuTop(){
    return menu.offsetTop;
  }

  function fastScrollTo(targetY, duration){
    var startY = home.scrollTop;
    var distance = targetY - startY;
    var startTime = null;

    function easeOutExpo(t){
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }
    function step(timestamp){
      if(!startTime) startTime = timestamp;
      var elapsed = timestamp - startTime;
      var progress = Math.min(elapsed / duration, 1);
      home.scrollTop = startY + distance * easeOutExpo(progress);
      if(progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function goToMenu(){
    if(scrollLock) return;
    lockScroll(1000);
    fastScrollTo(menuTop(), 800);
  }

  function goToHome(){
    if(scrollLock) return;
    lockScroll(1000);
    fastScrollTo(0, 800);
  }

  arrow.addEventListener('click', goToMenu);

  home.addEventListener('wheel', function(e){
    if(scrollLock){ e.preventDefault(); return; }
    var y  = home.scrollTop;
    var mt = menuTop();
    if(y < mt * 0.3 && e.deltaY > 0){ e.preventDefault(); goToMenu(); return; }
    if(Math.abs(y - mt) < 30 && e.deltaY < 0){ e.preventDefault(); goToHome(); return; }
  }, { passive:false });

  var touchStartY = 0;
  var touchTriggered = false;

  home.addEventListener('touchstart', function(e){
    touchStartY = e.touches[0].clientY;
    touchTriggered = false;
  }, { passive:true });

  home.addEventListener('touchmove', function(e){
    if(scrollLock){ e.preventDefault(); return; }
    if(touchTriggered) return;
    var y  = home.scrollTop;
    var mt = menuTop();
    var dy = touchStartY - e.touches[0].clientY;
    if(y < mt * 0.3 && dy > 14){
      e.preventDefault(); touchTriggered = true; goToMenu(); return;
    }
    if(Math.abs(y - mt) < 30 && dy < -14){
      e.preventDefault(); touchTriggered = true; goToHome(); return;
    }
  }, { passive:false });

})();

</script>
